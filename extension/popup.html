<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #f8f9fa;
      color: #333;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-weight: bold;
      color: #1a56b2;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 6px;
      border-radius: 4px;
      background: #e2e3e5;
      color: #383d41;
      margin-bottom: 10px;
      display: block;
      text-align: center;
    }
    .status-badge.online {
      background: #d4edda;
      color: #155724;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      background: #2b78e4;
      color: white;
      border: none;
      padding: 7px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1a56b2;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>⚡ IDM Clone Integration</span>
  </div>
  <div id="status" class="status-badge">Checking Host Connection...</div>
  
  <label for="urlInput"><b>Direct Download:</b></label>
  <input type="text" id="urlInput" placeholder="https://example.com/file.zip" />
  <button id="downloadBtn">Send to IDM Clone</button>

  <script src="popup.js"></script>
</body>
</html>
