[project]
name = "idm-clone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daffa", email = "daffakurama10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
idm-clone = "idm_clone:main"
idm-gui = "idm_gui:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
